name: CI
on:
  push:
    branches: [main]
    paths: [Sources/**, Tests/**, Package.swift]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    # The speech pipeline uses the modern SpeechAnalyzer API, so the
    # build needs the newest macOS SDK the fleet offers.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the image
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest"
          swift --version
      - name: Quality gate (pattern rules)
        env:
          QUALITY_GATE_SKIP_BUILD: "1"
        run: sh Scripts/quality-gate.sh
      - name: Run deterministic test suite
        run: swift test
