name: Uptime watchdog
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check every public page
        run: |
          fail=0
          for u in "" compare.html guide-agent-notifications.html trae.html gallery.html llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://lttxzmj.github.io/sleepwing/$u")
            echo "/$u -> $code"
            [ "$code" = "200" ] || fail=1
          done
          rel=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://api.github.com/repos/lttxzmj/sleepwing/releases/latest")
          echo "releases/latest -> $rel"
          [ "$rel" = "200" ] || fail=1
          # The download button must point at a fetchable asset — a 200
          # page with a dead button is the failure mode that cost us our
          # first three visitors.
          dl=$(curl -s -m 20 "https://lttxzmj.github.io/sleepwing/" | grep -oE 'downloadUrl: "[^"]+"' | cut -d'"' -f2)
          echo "button url: $dl"
          case "$dl" in https://github.com/lttxzmj/sleepwing/releases/download/*) :;; *) echo "bad button url"; fail=1;; esac
          code=$(curl -sL -o /dev/null -w '%{http_code}' -m 30 "$dl")
          echo "button asset -> $code"
          [ "$code" = "200" ] || fail=1
          exit $fail
      - name: Raise an issue so a human (or agent) sees it
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "watchdog"});
            if (open.data.length === 0) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title: "⚠️ Uptime watchdog: a public surface is failing",
                labels: ["watchdog"],
                body: "Automated daily check failed. Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId});
            }
